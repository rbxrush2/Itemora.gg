<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Grow A Garden Items</title>
<link rel="icon" type="image/png" href="logo.png">

<!-- FONT AWESOME -->
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">

<style>
body {
    margin: 0;
    font-family: 'Poppins', sans-serif;
    background: #02121F;
    color: white;
}

/* HEADER */
.top-bar {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 18px 30px;
    background: rgba(255,255,255,0.03);
    border-bottom: 1px solid rgba(255,255,255,0.05);
}

.back-btn {
    color: #00eaff;
    font-weight: 600;
    cursor: pointer;
    text-decoration: none;
    font-size: 16px;
}
.back-btn:hover { opacity: 0.7; }

.cart-icon {
    position: relative;
    font-size: 22px;
    cursor: pointer;
    color: white;
}
.cart-icon .indicator {
    position: absolute;
    top: -6px;
    right: -6px;
    width: 10px;
    height: 10px;
    background: red;
    border-radius: 50%;
    display: none; /* JS will show */
}

/* TITLE */
.page-title {
    margin: 25px 35px;
    font-size: 32px;
    font-weight: 700;
}

/* SEARCH BAR */
.search-box {
    width: 90%;
    margin: 0 auto;
    margin-bottom: 30px;
}
.search-box input {
    width: 100%;
    padding: 12px 15px;
    border-radius: 10px;
    border: none;
    outline: none;
    background: rgba(255,255,255,0.08);
    color: white;
    font-size: 16px;
}

/* ITEM GRID */
.items-container {
    width: 90%;
    margin: 0 auto;
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(230px, 1fr));
    gap: 25px;
    padding-bottom: 40px;
}

/* ITEM CARD */
.item-card {
    background: rgba(255,255,255,0.05);
    border: 1px solid rgba(255,255,255,0.1);
    border-radius: 14px;
    padding: 15px;
    text-align: center;
    transition: 0.2s ease;
}
.item-card:hover {
    transform: scale(1.03);
}

/* SQUARE IMAGE */
.item-img {
    width: 100%;
    aspect-ratio: 1 / 1;
    background: rgba(255,255,255,0.1);
    border-radius: 12px;
    overflow: hidden;
}
.item-img img {
    width: 100%;
    height: 100%;
    object-fit: cover;
}

/* ITEM TITLE */
.item-card h3 {
    margin: 12px 0 5px;
    font-size: 18px;
}

/* PRICE */
.price-box {
    margin: 8px 0;
}
.old-price {
    color: #ff6b6b;
    text-decoration: line-through;
    font-size: 14px;
}
.new-price {
    color: #00eaff;
    font-size: 18px;
    font-weight: 700;
}

/* CART BUTTON */
.add-cart-btn {
    margin-top: 10px;
    background: #00eaff;
    color: black;
    border: none;
    padding: 8px 15px;
    border-radius: 14px;
    cursor: pointer;
    font-weight: 700;
    transition: 0.15s;
}
.add-cart-btn:hover {
    transform: scale(1.07);
}
</style>
</head>

<body>

<!-- HEADER -->
<div class="top-bar">
    <a class="back-btn" href="explore.html"><i class="fa-solid fa-arrow-left"></i> Back</a>

    <div class="cart-icon" onclick="location.href='cart.html'">
        <i class="fa-solid fa-cart-shopping"></i>
        <div class="indicator" id="cartIndicator"></div>
    </div>
</div>

<!-- PAGE TITLE -->
<div class="page-title">Buy GAG Items</div>

<!-- SEARCH BAR -->
<div class="search-box">
    <input type="text" placeholder="Search items...">
</div>

<!-- ITEMS -->
<div class="items-container">

    <!-- DRAGONFLY ITEM -->
    <div class="item-card">
        <div class="item-img">
            <img src="df.png" alt="DragonFly">
        </div>

        <h3>DragonFly</h3>

        <div class="price-box">
            <span class="old-price">$4.99</span><br>
            <span class="new-price">$1.49</span>
        </div>

        <button class="add-cart-btn" onclick="addToCart()">
            <i class="fa-solid fa-cart-plus"></i> Add to Cart
        </button>
    </div>

</div>

<script>
function addToCart() {
    document.getElementById("cartIndicator").style.display = "block";
}
</script>

</body>
</html>
