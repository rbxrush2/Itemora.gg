<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Itemora — DonutSMP & Roblox Store</title>
<link rel="icon" type="image/png" href="logo.png">

<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">

<style>
:root{ --teal:#00eaff; --bg:#00151a; }
*{box-sizing:border-box}
body{
  margin:0;
  font-family:'Poppins',sans-serif;
  background:var(--bg);
  color:#eaf6fb;
  animation:fadeIn .8s ease forwards;
}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}

body::before{
  content:"";
  position:fixed; inset:0;
  z-index:-1;
  background:
    radial-gradient(circle at 20% 30%, rgba(0,230,255,.12), transparent 45%),
    radial-gradient(circle at 80% 70%, rgba(120,70,255,.12), transparent 45%);
  filter:blur(50px);
}

/* HEADER */
header{
  display:flex;
  justify-content:space-between;
  align-items:center;
  padding:18px 40px;
}
.logo img{width:120px}
nav a{
  margin-left:16px;
  text-decoration:none;
  color:#eaf6fb;
  font-weight:600;
}
nav a:hover{color:var(--teal)}

/* HERO */
.hero{
  text-align:center;
  padding:110px 20px 40px;
}
.main-image{
  width:420px;
  max-width:80%;
  margin:auto;
  display:block;
  animation:float 4s ease-in-out infinite;
}
@keyframes float{
  50%{transform:translateY(-14px)}
}
.main-title{
  font-size:44px;
  font-weight:900;
  color:var(--teal);
}
.store-title{
  font-size:22px;
  font-weight:900;
  letter-spacing:1px;
  margin:6px 0;
}
.tagline{opacity:.9}
.cta{
  display:inline-block;
  margin-top:18px;
  padding:14px 34px;
  background:var(--teal);
  color:#07121a;
  border-radius:30px;
  text-decoration:none;
  font-weight:900;
}

/* SECTIONS */
.section{padding:60px 20px; text-align:center}
.section-title{
  font-size:30px;
  margin-bottom:30px;
}

/* ITEMS */
.item-grid{
  display:grid;
  grid-template-columns:repeat(auto-fill,minmax(220px,1fr));
  gap:20px;
  max-width:1000px;
  margin:auto;
}
.item-card{
  background:rgba(255,255,255,.03);
  border-radius:14px;
  padding:14px;
  transition:.2s;
}
.item-card:hover{transform:translateY(-6px)}
.item-thumb{
  width:100%;
  height:160px;
  object-fit:cover;
  border-radius:10px;
}
.item-info h4{margin:10px 0 4px}
.item-info p{font-size:14px; opacity:.85}

/* FOOTER */
footer{
  padding:26px;
  text-align:center;
  opacity:.7;
}

@media(max-width:600px){
  .main-title{font-size:30px}
}
</style>
</head>

<body>

<header>
  <div class="logo">
    <img src="logo.png" alt="Itemora">
  </div>
  <nav>
    <a href="#home">Home</a>
    <a href="#shop">Shop</a>
    <a href="#contact">Contact</a>
  </nav>
</header>

<section id="home" class="hero">
  <img src="mainimage.png" class="main-image" alt="Itemora">
  <h1 class="main-title">Itemora</h1>
  <div class="store-title">DonutSMP & Roblox Store</div>
  <p class="tagline">Purchase items directly from our Discord</p>

  <a class="cta" target="_blank" href="https://discord.gg/DfQsTWWBB5">
    Join Discord to Purchase
  </a>
</section>

<section id="shop" class="section">
  <h2 class="section-title">Popular Items</h2>

  <div class="item-grid">
    <div class="item-card">
      <img src="raccoon.png" class="item-thumb">
      <div class="item-info">
        <h4>Raccoon</h4>
        <p>Grow a Garden (GAG)</p>
      </div>
    </div>

    <div class="item-card">
      <img src="brainrot.png" class="item-thumb">
      <div class="item-info">
        <h4>67 Brainrot</h4>
        <p>Steal a Brainrot (SAB)</p>
      </div>
    </div>

    <div class="item-card">
      <img src="skellys.png" class="item-thumb">
      <div class="item-info">
        <h4>Skellys</h4>
        <p>DonutSMP</p>
      </div>
    </div>

    <div class="item-card">
      <img src="100m.png" class="item-thumb">
      <div class="item-info">
        <h4>100 Million</h4>
        <p>DonutSMP</p>
      </div>
    </div>
  </div>
</section>

<section id="contact" class="section">
  <h2 class="section-title">Contact</h2>
  <p>Email: rbxrush9@gmail.com</p>
</section>

<footer>© 2025 Itemora</footer>

</body>
</html>
